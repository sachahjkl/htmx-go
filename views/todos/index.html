<p class="text-xs mb-2">
  <a href="/" class="text-base-content opacity-60"
    ><span class="rotate-180 inline-block">➜</span> Go back home</a
  >
</p>
<h1 class="text-lg font-bold mb-2">Todos</h1>
<form
  hx-post="/todos"
  hx-on::after-request="this.reset()"
  hx-target="#todos ul"
  hx-swap="beforeend"
  hx-indicator="#todo-add-spinner"
  class="mb-5"
>
  <div class="flex gap-3 flex-wrap items-center">
    <input
      type="text"
      id="todo-title"
      name="todo-title"
      class="block grow-[6] p-2 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 sm:text-xs focus:ring-blue-500 focus:border-blue-500"
      placeholder="Your next task..."
    />
    <button
      type="submit"
      class="grow-0 shrink-0 px-3 py-2 text-xs font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    >
      Add Todo
    </button>
  </div>
</form>

<!-- this element will get replaced by HTMX when we submit our form -->
{{ template "todos/list" . }}
