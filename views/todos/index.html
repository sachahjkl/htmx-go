<main class="container p-4 mx-auto mt-4 border bg-white rounded-sm shadow-sm">
  <p>
    <a href="/" class="text-base-content opacity-60"
      ><span class="rotate-180 inline-block">➜</span> Go back home</a
    >
  </p>
  <h1 class="text-lg font-bold mb-2">todos</h1>
  <form
    hx-post="/todos"
    hx-target="#todos"
    hx-swap="outerHTML"
    hx-select="#todos"
    class="mb-2"
  >
    <div class="flex justify-start gap-3 items-center">
      <input
        type="text"
        id="todo-title"
        name="todo-title"
        class="block p-2 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 sm:text-xs focus:ring-blue-500 focus:border-blue-500"
        placeholder="Your next task..."
      />
      <button
        type="submit"
        class="px-3 py-2 text-xs font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
      >
        Add Todo
      </button>
    </div>
  </form>

  <!-- this element will get replaced by HTMX when we submit our form -->
  <section id="todos">
    <ul>
      {{ range .Todos }}

      <li class="flex items-center">
        <svg
          hx-post="/todos/{{.Id}}/toggle"
          hx-target="#todos"
          hx-swap="outerHTML"
          hx-select="#todos"
          class="w-3.5 h-3.5 mr-2 
          {{ if .Done }}
          text-green-500 dark:text-green-400 
          {{ else }}
          text-gray-500 dark:text-gray-400
          {{end}}
          
          flex-shrink-0"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"
          />
        </svg>
        <span
          class="
          {{ if .Done }}
          line-through
          {{end}}"
        >
          {{ .Title }}
        </span>
      </li>
      {{end}}
    </ul>
  </section>
</main>
